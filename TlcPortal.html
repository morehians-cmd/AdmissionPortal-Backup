<style>
/* ===== TLC Scholarship Application Portal =====
   Drawn with the portal's own tokens (--navy, --blue, --line, --mut, --soft, --card), so day / night mode works.

.tl-cert{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px;background:var(--card,#fff)}.tl-cert h4{margin:0 0 8px;color:var(--navy);font-size:15px}

/* ---- staff ---- */
.tl-k{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tl-k button{border:1px solid var(--line);background:var(--card,#fff);border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer;color:var(--mut);text-align:left}.tl-k button b{display:block;font-size:18px;color:var(--navy);line-height:1.1}.tl-k button span{font-size:12px}
.tl-k button.on{border-color:var(--blue);background:var(--soft)}
.tl-a tr[data-act]{cursor:pointer}.tl-a td small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.tl-m{max-width:880px;width:100%;max-height:92vh;display:flex;flex-direction:column}.tl-m .bd{overflow:auto;padding:22px}.tl-m .ft{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--line)}
.tl-m h3{margin:0 0 4px;color:var(--navy)}.tl-m h5{margin:20px 0 8px;color:var(--navy);font-size:14px}
.tl-kv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:5px 14px;margin:0;font-size:13.5px}.tl-kv dt{color:var(--mut)}.tl-kv dd{margin:0;font-weight:600;color:var(--navy);overflow-wrap:anywhere}
.tl-m details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}.tl-m summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:14px}.tl-m details[open] summary{margin-bottom:10px}
.tl-dr{display:grid;grid-template-columns:minmax(0,1.4fr) 140px minmax(0,1.2fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.tl-dr:first-of-type{border-top:0}
.tl-dr select,.tl-dr input{height:38px;border:1px solid #cbd5e1;border-radius:9px;padding:0 10px;font:inherit;background:var(--card,#fff);color:var(--txt);width:100%}
.tl-dr .btn{padding:7px 14px;font-size:13px}
.tl-act{display:flex;gap:8px;flex-wrap:wrap}.tl-act .btn{padding:8px 16px;font-size:13.5px}.btn.tl-no{background:#fff;color:#b3261e;border-color:#f1b4ae}
.tl-ms{display:grid;grid-template-columns:minmax(0,1.5fr) 150px 150px minmax(0,1.5fr) auto;gap:8px;margin-bottom:8px;align-items:center}

 .tl-row.e,.tl-row.s{grid-template-columns:1fr 1fr}.tl-row.e .gl{grid-column:1/-1}.tl-row.h{display:none}.tl-row.s>:first-child,.tl-row.s>:last-child{grid-column:1/-1}
 .tl-dr,.tl-ms{grid-template-columns:1fr}.tl-hero h2{font-size:22px}}

<script>
/* ===== TLC Scholarship Application Portal (client) =====
   Server: Tlc.gs.  Pages: 'tlc' (dashboard) and 'tlf' (application form) for enrollees, 'tla' (applications) for Admission staff.
   Loaded after the main script, so it wraps menuFor / nav / bnInit exactly like the Enrollee Portal does. */

const TL_ST = {
  'Draft':          { l: 'Draft',                  c: 'warn', h: 'You have not submitted your application yet.' },
  'Submitted':      { l: 'Submitted',              c: '',     h: 'Your application was received. The Admission Office will start the review soon.' },
  'Under Review':   { l: 'Under review',           c: '',     h: 'The Admission Office is checking your application and documents.' },
  'For Compliance': { l: 'Action needed',          c: 'warn', h: 'The Admission Office needs something from you. Read the note, update your form and submit again.' },
  'Endorsed':       { l: 'Endorsed to TLC Office', c: '',     h: 'Your application is complete and was sent to the TLC Office for final evaluation.' },
  'Approved':       { l: 'Approved',               c: 'ok',   h: 'Congratulations! Your TLC Scholarship application was approved.' },
  'Declined':       { l: 'Not approved',           c: 'no',   h: 'Your application was not approved.' }
};
const TL_STEPS = [
  { t: 'Eligibility',      s: 'Who can apply' },
  { t: 'About you',        s: 'Personal information' },
  { t: 'School choices',   s: 'TLC Partner Schools' },
  { t: 'Elementary',       s: 'Grades 1 to 6' },
  { t: 'Parents',          s: 'Father and mother' },
  { t: 'Household',        s: 'Home and siblings' },
  { t: 'Review & submit',  s: 'Certification' }
];
const TL_ELIG = [
  ['E1', 'I am finishing public elementary school in Taguig or Pateros, and I studied in a public school in Taguig or Pateros for the last three (3) years.'],
  ['E2', 'I will enroll in Grade 7.'],
  ['E3', 'I have good moral standing, certified by the principal of my school.'],
  ['E4', 'I and at least one of my parents have lived in Taguig for not less than three (3) years.'],
  ['E5', 'My parent is a registered and active voter of Taguig, for the last three (3) years before this application.'],
  ['E6', 'I am joining the program voluntarily, with my parent\u2019s written consent. My parent promises to guide and support me.']
];
const TL_EDU = ['', 'No formal schooling', 'Elementary level', 'Elementary graduate', 'High school level', 'High school graduate', 'College level', 'College graduate', 'Vocational', 'Master\u2019s degree', 'Doctorate'];
const TL_HOUSING = [['', 'Select\u2026'], ['Family-owned', 'Owned by my family'], ['Relative-owned', 'Owned by a relative'], ['Renting', 'Renting or paying in installments'], ['Others', 'Other']];
const TL_GUIDE = [
  ['Check that you qualify', 'Read the eligibility requirements in the TLC Scholarship Information card, then confirm them in step 1 of the form.'],
  ['Fill in the online form', 'The form has seven short sections. Your answers are saved as a draft, so you can stop and come back any time before you submit.'],
  ['Submit before the deadline', 'After you submit, you get a reference number here and by email. The form is locked while the Admission Office reviews it.'],
  ['Print and sign', 'Print the application form. Both you and your parent or guardian must sign it. Wrong or false information can disqualify you.'],
  ['Prepare your documents', 'Use the Requirements Checklist. Put two (2) sets of the requirements in one long brown expandable envelope and one long brown ordinary envelope.'],
  ['Bring everything to the Admission Office', 'The staff will mark each document as received or verified in your checklist. Watch your Notifications for updates.'],
  ['Fix anything we ask for', 'If your status shows \u201CAction needed\u201D, read the note, correct the form or document, and submit again.']
];
const tlFmt = s => esc(s).replace(/[*][*](.+?)[*][*]/g, '<b>$1</b>').replace(/__(.+?)__/g, '<i>$1</i>');
const tlD = d => { d = String(d || '').slice(0, 10); return /^\d{4}-\d{2}-\d{2}$/.test(d) ? fmtD(d) : ''; };
const tlJ = (s, d) => { try { const v = JSON.parse(s); return v == null ? d : v; } catch (e) { return d; } };
const tlSy = s => String(s || '').replace('-', '\u2013');
const tlChip = (st) => { const m = TL_ST[st] || TL_ST.Draft; return `<span class="chip ${m.c}">${esc(m.l)}</span>`; };
const tlBtn = (label, a, v, alt) => `<button class="btn${alt ? ' alt' : ''}" data-act="${a}"${v != null ? ` data-v="${esc(v)}"` : ''}>${esc(label)}</button>`;
function tlLoad(cb) { call('tlcPortal', [T()], r => { S.tl = r.data; cb(r.data); }); }

/* ===================== DASHBOARD ===================== */
function tlcDash() {
  head('TLC Scholarship', 'Taguig Learners\u2019 Certificate Scholarship Program');
  tlLoad(tlDashRender);
}
function tlStage(st) { return { 'Draft': 0, 'Submitted': 1, 'Under Review': 2, 'For Compliance': 2, 'Endorsed': 3, 'Approved': 4, 'Declined': 4 }[st] || 0; }

function tlOverview(d) {
  const a = d.app, st = d.status, m = TL_ST[st] || TL_ST.Draft, began = d.exists && (d.progress > 0), locked = !d.editable;
  let h, sub;
  if (st === 'Draft') { h = began ? 'Continue your application' : 'Start your TLC Scholarship application'; sub = began ? 'Your form is ' + d.progress + '% complete. Pick up where you left off.' : 'Seven short sections, about 15 to 20 minutes. Everything you type is saved as a draft.'; }
  else { h = m.l; sub = m.h; }
  const ctas = (st === 'Draft' || st === 'For Compliance') ? tlBtn(began || st !== 'Draft' ? 'Open application form' : 'Start application', 'nav', 'tlf') : tlBtn('View my application', 'nav', 'tlf') + (st !== 'Draft' ? tlBtn('Print application form', 'tlprint', '', 1) : '');
  const win = d.state.key === 'open' ? (d.state.daysLeft != null ? (d.state.daysLeft < 0 ? 'Closed' : d.state.daysLeft === 0 ? 'Last day to submit' : d.state.daysLeft + ' day' + (d.state.daysLeft === 1 ? '' : 's') + ' left') : 'Open') : d.state.label;
  const facts = [['Application status', m.l], ['Submissions', win], ['Reference', a.TlcRef || 'Given on submit'], ['School year', tlSy(d.sy)]]
    .map(x => `<div class="tl-fact"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('');
  const hero = `<section class="tl-hero"><div><span class="tl-badge">TLC Scholarship \u00b7 SY ${esc(tlSy(d.sy))}</span><h2>${esc(h)}</h2><p>${esc(sub)}</p><div class="tl-cta">${ctas}</div></div><div class="tl-facts">${facts}</div></section>`;
  const idx = tlStage(st), end = st === 'Approved' || st === 'Declined';
  const labels = ['Application form', 'Submitted', 'Under review', 'Endorsed to TLC Office', 'Result'];
  const trk = `<ol class="tl-trk" aria-label="Application progress">${labels.map((l, i) => {
    let c = i < idx ? 'd' : i === idx ? (st === 'For Compliance' ? 'x' : 'n') : '';
    if (end && i === 4) c = st === 'Approved' ? 'd' : 'e';

  const tb = rows.length ? `<div class="tw"><table class="at tl-a"><thead><tr><th>Reference</th><th>Applicant</th><th>School choices</th><th>Documents</th><th>Status</th><th>Submitted</th></tr></thead><tbody>${rows.map(r => `<tr data-act="tlaopen" data-v="${esc(r.StudentID)}" tabindex="0"><td>${esc(r.TlcRef || '\u2014')}</td><td><b>${esc(tc(r.Name))}</b><small>${esc(r.LRN)} \u00b7 ${esc(r.Barangay || '')}</small></td><td>${esc([r.Choice1, r.Choice2, r.Choice3].filter(Boolean).join(', '))}</td><td>${r.DocsDone} of ${r.DocsTotal}</td><td>${tlChip(r.Status)}</td><td>${esc(tlD(r.SubmittedAt) || '\u2014')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="tl-empty">No applications match.</div>';

act.tlaexp = () => call('tlcAdminExport', [T()], r => { const b = new Blob(['\ufeff' + r.data.csv], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = r.data.name; document.body.appendChild(a); a.click(); a.remove(); });
document.addEventListener('keydown', e => { const r = e.target.closest && e.target.closest('.tl-a tr[data-act]'); if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act.tlaopen(r.dataset.v); } });

function tlaModal(x) {
  const a = x.app, el = tlJ(a.ElemJSON, []), sb = tlJ(a.SiblingsJSON, []), kv = rows => `<dl class="tl-kv">${rows.filter(r => r[1] !== '' && r[1] != null).map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>`;

  const docs = x.docs.map(dc => `<div class="tl-dr"><div><b>${esc(dc.t)}</b>${dc.o ? ' <span class="chip">Optional</span>' : ''}${dc.prepared && !dc.s ? '<br><small style="color:var(--mut)">Applicant ticked: ready to bring</small>' : ''}${dc.d && dc.s ? `<br><small style="color:var(--mut)">${esc(dc.s)} ${esc(tlD(dc.d))}</small>` : ''}</div>
     <select id="tld_${dc.k}" aria-label="Status of ${esc(dc.t)}">${[['', 'Not received'], ['Received', 'Received'], ['Verified', 'Verified'], ['Resubmit', 'Bring again']].map(o => `<option value="${o[0]}"${o[0] === dc.s ? ' selected' : ''}>${o[1]}</option>`).join('')}</select>
     <input id="tln_${dc.k}" value="${esc(dc.n)}" placeholder="Note (required for Bring again)" maxlength="200"><button class="btn alt" data-act="tlasdoc" data-v="${x.app.StudentID}|${dc.k}">Save</button></div>`).join('');
  const btns = (x.allowed || []).map(s => `<button class="btn${s === 'Declined' ? ' tl-no' : ''}" data-act="tlastat" data-v="${esc(a.StudentID)}|${esc(s)}">${esc({ 'Under Review': 'Start / restart review', 'For Compliance': 'Return for compliance', 'Endorsed': 'Endorse to TLC Office', 'Approved': 'Approve', 'Declined': 'Not approved' }[s] || s)}</button>`).join('') || '<span style="color:var(--mut);font-size:13px">No status change available.</span>';
  const hist = (x.history || []).length ? `<ul class="tl-hist">${x.history.map(h => `<li><b>${esc(h.ev)}</b>${h.d ? ' \u2014 ' + esc(h.d) : ''}<small>${esc(h.by)} \u00b7 ${esc(h.at)}</small></li>`).join('')}</ul>` : '<p class="tl-q">No history yet.</p>';
  const old = $('tlam'); if (old) old.remove();
  const m = document.createElement('div'); m.className = 'mod'; m.id = 'tlam';
  m.innerHTML = `<div class="tl-m"><div class="bd"><div class="tl-fh"><div><h3>${esc(tc(tlName(a)))}</h3><p>${esc(a.TlcRef || 'Not submitted')} \u00b7 LRN ${esc(a.LRN)} \u00b7 ${esc(x.student.grade || '')} \u00b7 ${esc(x.student.enrollStatus || '')}</p></div>${tlChip(x.status)}</div>
   ${(x.warnings || []).map(w => `<div class="tl-note warn" style="margin:10px 0 0">${esc(w)}</div>`).join('')}${a.ReviewNote ? `<div class="tl-note" style="margin:10px 0 0"><b>Last note${a.ReviewedBy ? ' by ' + esc(a.ReviewedBy) : ''}:</b> ${esc(a.ReviewNote)}</div>` : ''}
   <h5>Status</h5><div class="tl-act">${btns}</div>
   <h5>Documents (${x.docsDone} of ${x.docsTotal} required received)</h5>${docs}
   <h5>Application</h5>
   ${det('Applicant', kv([['Birth date', a.Birthdate], ['Place of birth', a.BirthPlace], ['Sex', a.Sex], ['Nationality', a.Nationality], ['Religion', a.Religion], ['Address', [a.Address, a.Barangay, a.City].filter(Boolean).join(', ')], ['Years in Taguig', a.ResidencyYears], ['Mobile', a.Mobile], ['Telephone', a.Telephone], ['Email', a.Email], ['Case / complaint', a.HasCase + (a.CaseDetails ? ': ' + a.CaseDetails : '')]]), 1)}
   ${det('School choices', kv([['1st', a.Choice1], ['2nd', a.Choice2], ['3rd', a.Choice3]]))}
   ${det('Elementary education', kv(el.map((r, i) => ['Grade ' + (i + 1), [r.school, r.location, r.award].filter(Boolean).join(' \u00b7 ')])))}
   ${det('Father', par('Father'))}${det('Mother', par('Mother'))}
   ${det('Household and siblings', kv([['Housing', a.Housing + (a.HousingOther ? ': ' + a.HousingOther : '')], ['Electric bill', a.ElectricBill], ['Water bill', a.WaterBill], ['Rent', a.MonthlyRent], ['Family members', a.FamilySize], ['TLC beneficiary in family', a.TlcRelative + (a.TlcRelativeDetail ? ': ' + a.TlcRelativeDetail : '')]].concat(sb.map((r, i) => ['Sibling ' + (i + 1), [r.name, r.age ? r.age + ' yrs' : '', r.civil, r.school].filter(Boolean).join(' \u00b7 ')]))))}
   ${det('Certification', kv([['Applicant', a.AppSignName + (a.AppAgree === '1' ? ' (agreed)' : '')], ['Parent / guardian', a.ParentName + (a.ParentRelation ? ' (' + a.ParentRelation + ')' : '')], ['Parent signature', a.ParentSignName + (a.ParentAgree === '1' ? ' (agreed)' : '')], ['Submitted', a.SubmittedAt]]))}
   <h5>History</h5>${hist}</div><div class="ft"><button class="btn alt" data-act="tlaprint" data-v="${esc(a.StudentID)}">Print application</button><button class="btn alt" data-act="tlaclose">Close</button></div></div>`;
  document.body.appendChild(m); S.tam = x;
}
const tlName = a => [a.Surname + ',', a.FirstName, a.MiddleName ? a.MiddleName[0] + '.' : '', a.Suffix].filter(Boolean).join(' ');
act.tlaclose = () => { const m = $('tlam'); if (m) m.remove(); };

act.tlasdoc = v => {
  const p = v.split('|'), st = $('tld_' + p[1]).value, n = $('tln_' + p[1]).value.trim();
  call('tlcAdminDoc', [T(), p[0], p[1], st, n], r => { toast('Document status saved.'); call('tlcAdminGet', [T(), p[0]], g => { tlaModal(g.data); }); tlaReload(); });

function tlaReload() { google.script.run.withSuccessHandler(r => { if (r && r.success && S.ta) { S.ta.d = r.data; if (S.navId === 'tla' && S.ta.tab === 'apps') tlaApps(); } }).tlcAdminBootstrap(S.token); }
act.tlastat = v => {
  const p = v.split('|'), id = p[0], st = p[1], need = st === 'For Compliance' || st === 'Declined';

act.tlsx = () => { const m = $('tlsm'); if (m) m.remove(); };
act.tlsok = v => {

/* ---- settings ---- */
function tlaCfg() {
  const d = S.ta.d, c = S.ta.cfg || (S.ta.cfg = JSON.parse(JSON.stringify(d.cfg))), ro = d.canEdit ? '' : ' disabled';
  const ms = c.milestones.map((m, i) => `<div class="tl-ms"><input data-tm="${i}" data-tf="title" value="${esc(m.title)}" placeholder="Step" maxlength="100"${ro}><input type="date" data-tm="${i}" data-tf="start" value="${esc(m.start)}" aria-label="Start date"${ro}><input type="date" data-tm="${i}" data-tf="end" value="${esc(m.end)}" aria-label="End date"${ro}><input data-tm="${i}" data-tf="note" value="${esc(m.note)}" placeholder="Short note for applicants" maxlength="200"${ro}>${d.canEdit ? `<button class="btn alt" data-act="tlmdel" data-v="${i}" aria-label="Remove step">Remove</button>` : ''}</div>`).join('');
  $('tlabody').innerHTML = `${d.canEdit ? '' : '<div class="tl-note">Only the administrator or System Manager can change these settings.</div>'}<div class="card"><div class="ch"><h3>Application window</h3></div><div class="g">
   <div class="f"><label for="tlc_acc">Accepting submissions</label><select id="tlc_acc" data-tc="accepting"${ro}><option value="1"${c.accepting !== '0' ? ' selected' : ''}>Yes</option><option value="0"${c.accepting === '0' ? ' selected' : ''}>No, pause submissions</option></select></div>
   <div class="f"><label for="tlc_open">Opening date</label><input type="date" id="tlc_open" data-tc="openDate" value="${esc(c.openDate)}"${ro}></div><div class="f"><label for="tlc_dl">Submission deadline</label><input type="date" id="tlc_dl" data-tc="deadline" value="${esc(c.deadline)}"${ro}></div></div>
   <p class="tl-q" style="margin-top:12px">Applicants can always fill in and save a draft. These settings control only when they can submit. Leave a date empty for no limit.</p></div>
   <div class="card"><div class="ch"><h3>Other schedule items</h3>${d.canEdit ? '<button class="btn alt" data-act="tlmadd">Add step</button>' : ''}</div><p class="tl-q">Shown on the applicants\u2019 dashboard after the opening date and deadline. Empty dates show as \u201CDate to be announced\u201D.</p><div class="tl-row s h tl-ms" style="grid-template-columns:minmax(0,1.5fr) 150px 150px minmax(0,1.5fr) auto"><div>Step</div><div>Start</div><div>End</div><div>Note</div><div></div></div>${ms || '<div class="tl-empty">No other steps.</div>'}</div>
   <div class="card"><div class="ch"><h3>Partner schools and contact</h3></div><div class="g"><div class="f wide"><label for="tlc_pl">TLC Partner Schools (one per line, suggested in the form)</label><textarea id="tlc_pl" data-tc="partners" style="text-transform:none;min-height:120px"${ro}>${esc((c.partners || []).join('\n'))}</textarea></div><div class="f wide"><label for="tlc_ct">Where to submit documents</label><textarea id="tlc_ct" data-tc="contact" style="text-transform:none"${ro}>${esc(c.contact)}</textarea></div></div></div>
   ${d.canEdit ? '<div class="act" style="position:static"><button class="btn" data-act="tlcsave">Save settings</button></div>' : ''}`;
}
document.addEventListener('input', e => {
  const t = e.target; if (!S.ta || !S.ta.cfg || !t.dataset) return;
  if (t.dataset.tc) { const k = t.dataset.tc; S.ta.cfg[k] = k === 'partners' ? t.value.split('\n') : t.value; }
  else if (t.dataset.tm != null && t.dataset.tf) S.ta.cfg.milestones[+t.dataset.tm][t.dataset.tf] = t.value;
});
act.tlmadd = () => { S.ta.cfg.milestones.push({ title: '', start: '', end: '', note: '' }); tlaCfg(); };
act.tlmdel = v => { S.ta.cfg.milestones.splice(+v, 1); tlaCfg(); };
act.tlcsave = () => {
  const c = JSON.parse(JSON.stringify(S.ta.cfg)); c.partners = (c.partners || []).map(s => s.trim()).filter(Boolean);
  call('tlcAdminSaveSettings', [T(), c], r => { S.ta.d.cfg = r.data; S.ta.cfg = JSON.parse(JSON.stringify(r.data)); toast(r.message); tlaReload(); tlaCfg(); });
};

/* ---- announcements ---- */
function tlaNews() {
  const d = S.ta.d, ro = d.canEdit;
  const list = d.notices.length ? `<ul class="tl-nt">${d.notices.map(n => `<li class="${esc(n.type)}"><b>${esc(n.title)}${n.pinned ? '<span class="pin">PINNED</span>' : ''}</b><p>${esc(n.msg)}</p><small>${esc(n.type)} \u00b7 posted ${esc(tlD(n.at))} by ${esc(n.by)}${n.until ? ' \u00b7 shows until ' + esc(tlD(n.until)) : ''}${ro ? ` \u00b7 <a href="javascript:void(0)" data-act="tlndel" data-v="${esc(n.id)}">Remove</a>` : ''}</small></li>`).join('')}</ul>` : '<div class="tl-empty">No announcements yet.</div>';
  $('tlabody').innerHTML = `${ro ? `<div class="card"><div class="ch"><h3>Post an announcement</h3></div><div class="g"><div class="f"><label for="tln_t">Title</label><input id="tln_t" maxlength="120" style="text-transform:none"></div><div class="f"><label for="tln_y">Type</label><select id="tln_y"><option>Info</option><option>Reminder</option><option>Urgent</option></select></div><div class="f"><label for="tln_u">Show until (optional)</label><input type="date" id="tln_u"></div><div class="f wide"><label for="tln_m">Message</label><textarea id="tln_m" maxlength="800" style="text-transform:none"></textarea></div><div class="f"><label class="tl-ck2" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="tln_p" style="width:auto;height:auto"> Pin to the top</label></div></div><div class="act" style="position:static;padding-bottom:0"><button class="btn" data-act="tlnpost">Post to applicants</button></div></div>` : '<div class="tl-note">Only the administrator or System Manager can post announcements.</div>'}<div class="card"><div class="ch"><h3>Announcements shown to applicants</h3></div>${list}</div>`;
}
act.tlnpost = () => call('tlcAdminNoticeSave', [T(), { title: $('tln_t').value, type: $('tln_y').value, until: $('tln_u').value, msg: $('tln_m').value, pinned: $('tln_p').checked }], r => { S.ta.d.notices = r.data; toast(r.message); tlaNews(); });
act.tlndel = v => { if (!confirm('Remove this announcement?')) return; call('tlcAdminNoticeDelete', [T(), v], r => { S.ta.d.notices = r.data; toast(r.message); tlaNews(); }); };

  return m;
};
const _homeTl = home;
home = function () {   // the homepage's "Apply online" button leaves a one-time flag, so applicants land on the TLC dashboard
  if (ENR()) { let g = ''; try { g = sessionStorage.getItem('mrh_go') || ''; if (g) sessionStorage.removeItem('mrh_go'); } catch (e) { } if (g === 'tlc') return nav('tlc'); }

const _navTl = nav;
nav = function (id) {
  const mine = (ENR() && (id === 'tlc' || id === 'tlf')) || (A() && id === 'tla' && !(typeof OFC === 'function' && OFC()) && !(typeof ACD === 'function' && ACD()));
  if (S.navId === 'tlf' && id !== 'tlf' && S.tf && S.tf.dirty) tlAuto();
  if (mine && id === 'tlf' && S.navId === 'tlf' && S.tf) { $('side').classList.remove('open'); return tlFormRender(); }   // already on the form: keep unsaved answers
  if (!mine) return _navTl(id);
  $('dd').classList.add('hidden'); $('np').classList.add('hidden'); $('side').classList.remove('open'); S.navId = id;
  document.querySelectorAll('#nav .nav').forEach(b => b.classList.toggle('on', b.dataset.v === id));

  if (id !== 'tlf' && S.tf) S.tf.stay = false;
  return ({ tlc: tlcDash, tlf: tlcForm, tla: tlcAdminPage })[id]();
};
