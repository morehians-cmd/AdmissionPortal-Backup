<style>
/* Application Pipeline — merged from New AP, drawn with Old AP's tokens and components. */
.pb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.pcol{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.pch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.pch b{color:var(--navy);font-size:14px}
.pcard{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
.pcard:last-child{margin-bottom:0}
.pnm{display:block;text-align:left;border:0;background:none;padding:0;font:600 13.5px Inter,sans-serif;color:var(--navy);cursor:pointer;width:100%}
.pnm:hover{color:var(--blue);text-decoration:underline}
.pmeta{font-size:12px;color:var(--mut);margin-top:2px}
.pacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.pacts button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font:600 11.5px Inter,sans-serif;color:var(--mut);cursor:pointer}
.pacts button:hover{border-color:var(--blue);color:var(--navy)}
.pempty{font-size:12.5px;color:var(--mut);border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center}
@media(max-width:1100px){.pb{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.pb{grid-template-columns:1fr}}
</style>
<script>
/* ===== Application Pipeline (merged from New AP) =====
   Server: admissionPipelineData / admissionApplicationStatusSet in AdmissionPipeline.gs.
   Uses Old AP's existing components and the existing act.open path (flopen) to edit a learner. */
var PIPE_LABEL = { 'Submitted': 'Submitted', 'Under Review': 'Under review', 'Approved': 'Approved', 'Declined': 'Declined' };
var PIPE_VERB = { 'Under Review': 'Start review', 'Approved': 'Approve', 'Declined': 'Decline' };

function pipeline() {
  head('Application Pipeline', 'Review submitted applications, approve, then complete enrollment once the initial requirements are in. The permanent Student ID is issued at enrollment.');
  S.pq = S.pq || '';
  $('view').innerHTML =
    '<div class="card"><div class="sb">' +
      '<input id="pq" value="' + esc(S.pq) + '" placeholder="Search name, LRN, Student ID or Enrollee Ref" onkeydown="if(event.key===\'Enter\')act.pipesearch()">' +
      '<button class="btn" data-act="pipesearch">' + I.search + ' Search</button>' +
      '<span id="pnote" style="color:var(--mut);font-size:13px;align-self:center">Loading…</span>' +
    '</div></div>' +
    '<div id="pboard" class="pb"><div class="pempty">Loading pipeline…</div></div>';
  pipeLoad(S.pq);
}

function pipeLoad(q) {
  S.pq = String(q || '');
  var note = $('pnote');
  if (note) note.textContent = 'Loading…';
  call('admissionPipelineData', [T(), S.pq, 120], function (r) {
    if (!r || !r.success) { if (note) note.textContent = (r && r.error) || 'Could not load the pipeline.'; return; }
    var d = r.data || {}, stages = d.stages || [];
    S.pipe = d;
    if (note) note.textContent = (d.total || 0) + (d.total === 1 ? ' application' : ' applications') + (d.drafts ? ' \u00b7 ' + d.drafts + ' enrollee' + (d.drafts === 1 ? '' : 's') + ' still filling in the form' : '');
    $('pboard').innerHTML = stages.map(pipeColumn).join('');
  });
}

function pipeColumn(col) {
  var cards = (col.cards || []).map(function (c) { return pipeCard(c); }).join('');
  return '<div class="pcol">' +
    '<div class="pch"><b>' + esc(PIPE_LABEL[col.key] || col.key) + '</b><span class="chip">' + Number(col.count || 0) + '</span></div>' +
    (cards || '<div class="pempty">No learners</div>') +
  '</div>';
}

function pipeCard(c) {
  var where = [tc(c.GradeLevel), tc(c.Section)].filter(Boolean).join(' \u2013 ');
  var allowed = c.Allowed || [];
  var btns = allowed.map(function (s) {
    return '<button data-act="pipestat" data-v="' + esc(c.StudentID) + '|' + esc(s) + '">' + (s === 'Declined' ? '' : '\u2192 ') + esc(PIPE_VERB[s] || PIPE_LABEL[s] || s) + '</button>';
  }).join('');
  var enr = '';
  if (c.Flow && c.ApplicationStatus === 'Approved' && c.EnrollStatus !== 'Enrolled' && c.CanEnroll) {
    enr = '<button data-act="pipenroll" data-v="' + esc(c.StudentID) + '" style="border-color:#16a34a;color:#15803d">\u2713 Complete enrollment</button>';
  }
  var prog = c.Flow && c.ApplicationStatus === 'Approved' && c.EnrollStatus !== 'Enrolled'
    ? '<div class="pmeta">Initial requirements: <b>' + Number(c.InitialDone || 0) + ' of ' + Number(c.InitialTotal || 0) + '</b>' + (c.CanEnroll ? ' \u00b7 ready to enroll' : ' \u00b7 record them in the learner file') + '</div>' : '';
  return '<div class="pcard">' +
    '<button class="pnm" data-act="flopen" data-v="' + esc(c.StudentID) + '">' + esc(tc(c.FullName) || 'Unnamed learner') + '</button>' +
    '<div class="pmeta">' + esc(c.LRN || '') + (c.Category ? ' \u00b7 ' + esc(c.Category) : '') + '</div>' +
    (c.PermanentID ? '<div class="pmeta">Student ID <b>' + esc(c.PermanentID) + '</b></div>' : '') +
    ((c.AppRef || c.StudentID) ? '<div class="pmeta">Enrollee Ref <b>' + esc(c.AppRef || c.StudentID) + '</b></div>' : '') +
    '<div class="pmeta">' + esc(where || 'No grade / section') + (c.EnrollStatus ? ' \u00b7 ' + esc(c.EnrollStatus) : '') + '</div>' +
    prog +
    '<div class="pacts">' + btns + enr + '</div>' +
  '</div>';
}

act.pipesearch = function () { pipeLoad(($('pq') && $('pq').value) || ''); };

act.pipestat = function (v) {
  var parts = String(v || '').split('|'), id = parts[0], status = parts[1];
  if (!id || !status) return;
  var rec = null;
  ((S.pipe && S.pipe.stages) || []).forEach(function (col) {
    (col.cards || []).forEach(function (c) { if (c.StudentID === id) rec = c; });
  });
  var old = document.getElementById('pm');
  if (old) old.remove();
  var m = document.createElement('div');
  m.className = 'mod';
  m.id = 'pm';
  m.innerHTML = '<div style="max-width:470px"><div class="bd">' +
    '<h3 style="color:var(--navy);margin:0 0 6px">' + (status === 'Approved' ? 'Approve application' : status === 'Declined' ? 'Decline application' : 'Move to ' + esc(PIPE_LABEL[status] || status)) + '</h3>' +
    '<p style="color:var(--mut);margin:0 0 14px">' + esc(rec ? tc(rec.FullName) + (rec.LRN ? ' \u00b7 ' + rec.LRN : '') : id) + '</p>' +
    '<div class="f"><label for="prs">Reason / note' + (status === 'Declined' ? ' (required)' : ' (optional)') + '</label>' +
    '<textarea id="prs" maxlength="300" style="text-transform:none" placeholder="Why is this application moving to ' + esc(PIPE_LABEL[status] || status) + '?"></textarea></div>' +
    (status === 'Approved' ? '<p style="font-size:12.5px;margin:10px 0 0"><b>Approving emails the next steps</b>: print the forms, bring the initial requirements to the Admission Office. The permanent Student ID (MAT-year-number) is issued when the learner is enrolled.</p>' : '') +
    '<p style="color:var(--mut);font-size:12.5px;margin:10px 0 0">The change is written to the Students sheet and the Application Status Log.</p>' +
    '</div><div class="ft"><button class="btn alt" data-act="pipex">Cancel</button>' +
    '<button class="btn" data-act="pipsave" data-v="' + esc(id) + '|' + esc(status) + '">' + (status === 'Approved' ? 'Approve application' : 'Save status') + '</button></div></div>';
  document.body.appendChild(m);
};

act.pipex = function () { var m = $('pm'); if (m) m.remove(); };

act.pipsave = function (v) {
  var parts = String(v || '').split('|'), id = parts[0], status = parts[1];
  var why = ($('prs') && $('prs').value.trim()) || '';
  if (status === 'Declined' && !why) { toast('Enter a reason for declining the application.', false); return; }
  call('admissionApplicationStatusSet', [T(), id, status, why], function (r) {
    var m = $('pm'); if (m) m.remove();
    toast(r.message || 'Application status saved.');
    pipeLoad(S.pq);
  });
};

/* Initial requirements are in and verified: the learner becomes Enrolled and a section can be assigned. */
act.pipenroll = function (id) {
  if (!id) return;
  if (!confirm('Mark this learner as Enrolled?\n\nUse this once the printed forms and initial requirements were received and verified. A section can be assigned afterwards.')) return;
  call('admissionProcessEnrollment', [T(), id], function (r) {
    toast(r.message || 'Enrolled.');
    pipeLoad(S.pq);
  });
};

/* The portal's login screen keeps its "Back to homepage" links working after the merge. */
(function () {
  ['hphome', 'hphome0'].forEach(function (id) {
    var a = document.getElementById(id);
    if (a) a.onclick = function (e) { if (e) e.preventDefault(); try { window.top.location.href = '?page=home'; } catch (x) { window.open('?page=home', '_top'); } };
  });
})();
</script>
